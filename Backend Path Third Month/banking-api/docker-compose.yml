services:
  postgres:
    image: postgres:16-alpine
    container_name: banking-api-m3-postgres
    environment:
      POSTGRES_USER: banking
      POSTGRES_PASSWORD: banking
      POSTGRES_DB: banking
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banking -d banking"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: banking-api-m3
    ports:
      - "8080:8080"
    environment:
      APP_ENV: development
      SERVER_PORT: "8080"
      DATABASE_URL: postgres://banking:banking@postgres:5432/banking?sslmode=disable
      JWT_SECRET: dev-secret-change-me
      WORKER_POOL_SIZE: "5"
      WORKER_QUEUE_SIZE: "100"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
